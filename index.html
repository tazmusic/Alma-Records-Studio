<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alma Records Studio | DJ Mix Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d0f12;
      color: #e2e8f0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #111418;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #232936;
      border-radius: 3px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #3b4252;
    }
    .traffic-active-green {
      background-color: #10b981 !important;
      color: #ffffff !important;
      border-color: #059669 !important;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .traffic-active-amber {
      background-color: #f59e0b !important;
      color: #ffffff !important;
      border-color: #d97706 !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .traffic-active-red {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden custom-scroll antialiased selection:bg-cyan-500 selection:text-black">

  <!-- TOP APP BAR -->
  <header class="h-14 border-b border-zinc-800 bg-[#111418] flex items-center justify-between px-3 md:px-4 z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <!-- Mobile View Switcher Button -->
      <button onclick="toggleMobileView()" class="md:hidden p-2 text-zinc-300 hover:text-white bg-zinc-800/80 rounded border border-zinc-700 text-xs">
        <i class="fa-solid fa-list-ul" id="mobile-view-icon"></i>
      </button>

      <div class="w-8 h-8 rounded bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-900/30 shrink-0">
        <i class="fa-solid fa-sliders text-white text-sm"></i>
      </div>
      <div>
        <h1 class="text-xs md:text-sm font-bold tracking-wider uppercase text-zinc-100 flex items-center gap-1.5 md:gap-2">
          ALMA RECORDS <span class="text-cyan-400 font-mono text-[10px] md:text-xs font-normal">STUDIO</span>
        </h1>
      </div>
    </div>

    <!-- DESKTOP STATS BAR -->
    <div class="hidden lg:flex items-center gap-6 text-xs font-mono">
      <div class="flex items-center gap-2 text-zinc-400">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
        <span>Active Projects: <strong class="text-zinc-100" id="stat-active-count">0</strong></span>
      </div>
      <div class="flex items-center gap-2 text-zinc-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Locked & Ready: <strong class="text-zinc-100" id="stat-locked-count">0</strong></span>
      </div>
      <div class="flex items-center gap-2 text-zinc-400">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
        <span>Unique Tunes: <strong class="text-zinc-100" id="stat-track-count">0</strong></span>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex items-center gap-2">
      <button onclick="createNewMix()" class="px-2.5 md:px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-semibold rounded flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus"></i>
        <span>New Mix</span>
      </button>
      <button onclick="exportJSONBackup()" title="Download Backup JSON" class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded transition text-xs">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </header>

  <!-- MAIN APP BODY -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- LEFT RAIL: MIX LIST (Adaptive for Mobile) -->
    <aside id="sidebar-panel" class="w-full md:w-80 border-r border-zinc-800/80 bg-[#12151b] flex flex-col shrink-0 absolute md:static inset-0 z-10 md:z-0 transition-transform duration-200">
      <div class="p-3 border-b border-zinc-800/60 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 font-mono">Mix Vault</span>
        <span class="text-[10px] text-zinc-500" id="mix-count-badge">0 mixes</span>
      </div>

      <!-- SEARCH & FILTER -->
      <div class="p-2.5 border-b border-zinc-800/40">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-zinc-500 text-xs"></i>
          <input type="text" id="mix-search-input" oninput="renderMixList()" placeholder="Filter mixes or genre..." class="w-full bg-[#171b22] border border-zinc-800 rounded pl-8 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-cyan-500/50">
        </div>
      </div>

      <!-- MIX CAR
